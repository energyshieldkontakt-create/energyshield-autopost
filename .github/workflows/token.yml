name: Token verlängern

# Der Instagram-Token läuft nach 60 Tagen ab. Jeden Montag wird er verlängert.
on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

jobs:
  verlaengern:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: refresh
        name: Token verlängern
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: python scripts/refresh_token.py
      - name: Neuen Token speichern
        if: steps.refresh.outputs.geaendert == 'ja'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Instagram hat einen neuen Token ausgegeben, aber das Secret GH_PAT fehlt. Siehe EINRICHTUNG.md, Schritt 6."
            exit 1
          fi
          gh secret set IG_TOKEN --repo "$GITHUB_REPOSITORY" < neuer_token.txt
      - name: Aufräumen
        if: always()
        run: rm -f neuer_token.txt
