<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="{{css}}">
<style>:root { --w: {{w}}px; --h: {{h}}px; {{akzent_css}} }</style>
</head>
<body class="cover">

      <circle class="punkt" cx="140" cy="330" r="5"/>
      <circle class="punkt" cx="300" cy="330" r="5"/>

    <div class="schild-inhalt">
      {{logo}}
      <div class="vol">Vol. {{vol}}</div>

  <h1 class="dj" data-fit>{{dj}}</h1>
  <div class="stil">{{stil}}</div>

</html>
