<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="{{css}}">
<style>:root { --w: {{w}}px; --h: {{h}}px; {{akzent_css}} }</style>
</head>
<body class="cover">
  <div class="strahlen"></div>
  {{deko}}
  <div class="hud">
    <span class="ecke e1"></span><span class="ecke e2"></span><span class="ecke e3"></span><span class="ecke e4"></span>
    <span class="hud-t t1">ES // Resident Mix Series</span>
    <span class="hud-t t2">SSN-{{vol}} // {{resident_code}}</span>
    <span class="hud-t t3">48.648°N · 9.451°E</span>
    <span class="hud-t t4">Drum &amp; Bass</span>
  </div>
  <header class="marke">ENERGYSHIELD</header>
  <div class="serie"><span>Shield Sessions</span></div>
  <div class="schild {{schild_klasse}}">
    <svg viewBox="0 0 440 520" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="metall" x1="0" y1="0" x2="0.35" y2="1">
          <stop offset="0%" stop-color="#232e3d"/>
          <stop offset="45%" stop-color="#0d141e"/>
          <stop offset="100%" stop-color="#030508"/>
        </linearGradient>
        <linearGradient id="stein" x1="0" y1="0" x2="0.4" y2="1">
          <stop offset="0%" stop-color="#2a2d33"/>
          <stop offset="50%" stop-color="#15171b"/>
          <stop offset="100%" stop-color="#060708"/>
        </linearGradient>
        <pattern id="waben" width="26" height="45" patternUnits="userSpaceOnUse">
          <path d="M13,0 L26,7.5 V22.5 L13,30 L0,22.5 V7.5 Z M13,30 V45" fill="none" stroke-width="1" style="stroke: var(--akzent)" opacity=".22"/>
        </pattern>
      </defs>
      {{schild}}
    </svg>
    <div class="schild-inhalt">
      {{logo}}
      <div class="vol">Vol. {{vol}}</div>
    </div>
  </div>
  <h1 class="dj" data-fit data-name="{{dj}}">{{dj}}</h1>
  <div class="stil"><span class="stil-text">{{stil}}</span></div>
  <div class="scan"></div>
  <div class="grain"></div>
  <div class="vignette"></div>
</body>
</html>
